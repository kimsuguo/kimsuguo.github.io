    <header class="header">
        <h1>镜头定格烟火，唯有爱与美食不可辜负</h1>
    <p>美食是生活最直白的治愈 —— 是清晨街角包子的热气氤氲，是深夜火锅沸腾的红油翻滚，是烘焙面包时满屋的麦香缠绕，是新鲜蔬果在盘中晕开的自然色泽。
一口下去，是味蕾的欢呼，也是疲惫的消解。那些藏在食材里的烟火气、烹饪时的心意、品尝时的满足，都是时光里最温柔的馈赠。
美食不可辜负，正如生活值得热爱，每一顿用心的餐食，都是对日子最深情的告白。</p>
</header>
<main>
     <ul id="album"><!-- 美食的产品列表相册  -->
        <li>
            <a href="img/artwork1.jpg" data-lightbox="image-1" data-title="第1张美食的图片">
                <figure>
                    <img src="img/suo1.jpg" alt="我是第一张小图">
                    <figcaption>
                        <h2>石锅番茄鲜蔬汤</h2>
                        <p>石锅滚烫的热气裹着橙黄色的番茄汤底，白菜叶舒展在绵密的泡沫里，粉丝浸满鲜汁、圆滚滚的丸子半露在汤面 —— 软嫩的蔬菜与酸甜的番茄香缠在一起，是秋冬里一口就能暖透胃的烟火气。</p>
                    </figcaption>
                </figure>
            </a>
        </li>
        <li>
            <a href="img/artwork2.jpg" data-lightbox="image-1" data-title="第2张图片">
                <figure>
                    <img src="img/suo2.jpg" alt="我是第2张小图">
                    <figcaption>
                        <h2>虫草花番茄浓汤锅</h2>
                        <p>同样是石锅盛着的红亮汤底，裹满酱汁的虫草花在汤里舒展成金黄的丝缕，几颗小番茄浸得软润，连汤勺都沾着浓郁的鲜味儿，是鲜爽与酸甜撞在一起的 “暖锅标配”。</p>
                    </figcaption>
                </figure>
            </a>
        </li>
        <li>
            <a href="img/artwork3.jpg" data-lightbox="image-1" data-title="第3张图片">
                <figure>
                    <img src="img/suo3.jpg" alt="我是第3张小图">
                    <figcaption>
                        <h2>剁椒紫苏浸鱼</h2>
                        <p>陶盆里的鱼肉浸在亮红的剁椒堆里，细碎的蒜末、葱花混着深紫的紫苏叶裹满鱼身，油亮的汤汁顺着鱼肉纹理往下淌 —— 光是看着这满盆的鲜辣劲儿，就能闻到剁椒的冲香与紫苏的清冽裹在一起的香气。</p>
                    </figcaption>
                </figure>
            </a>
        </li>
        <li>
            <a href="img/artwork4.jpg"data-lightbox="image-1" data-title="第4张图片">
                <figure>
                    <img src="img/suo4.jpg" alt="我是第4张小图">
                    <figcaption>
                        <h2>韩式芝士部队锅</h2>
                        <p>黑锅滚着红亮的汤汁，肥牛卷裹着芝士片堆在菜顶，金针菇、蟹柳、豆腐泡浸在汤里吸足了味儿，脆嫩的黄瓜片衬得整锅更鲜亮，是韩式料理里 “热热闹闹堆出来的治愈感”。</p>
                    </figcaption>
                </figure>
            </a>
        </li>
        <li>
            <a href="img/artwork5.jpg"data-lightbox="image-1" data-title="第5张图片">
                <figure>
                    <img src="img/suo5.jpg" alt="我是第5张小图">
                    <figcaption>
                        <h2>泡菜豆腐海苔泡面</h2>
                        <p>暖黄色陶碗里的泡面浸着橙红的泡菜汤，嫩豆腐块吸满了酸香，海苔碎裹着白芝麻铺在顶，泡菜叶的脆爽混着面的筋道，是一口就能尝到的韩式家常鲜味儿。</p>
                    </figcaption>
                </figure>
            </a>
        </li>
        <li>
            <a href="img/artwork6.jpg"data-lightbox="image-1" data-title="第6张图片">
                <figure>
                    <img src="img/suo6.jpg" alt="我是第6张小图">
                    <figcaption>
                        <h2>铁板围炉杂烩菜蘸水</h2>
                        <p>大黑铁板上堆得满满当当：薄切的土豆片浸着油光，脆嫩的青菜、弹润的肉卷裹着酱汁，中间黑陶碗里的蘸料浮着辣油 —— 滋啦的油香裹着各种食材的鲜，是围坐在一起 “边煮边吃” 的热闹烟火气。</p>
                    </figcaption>
                </figure>
            </a>
        </li>
    </ul>
